name: backend-ci

on:
  push:
    paths: ["backend/**", "render.yaml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "render.yaml", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: facts
          POSTGRES_PASSWORD: facts-ci
          POSTGRES_DB: facts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facts" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Les tests d'intégration PostgreSQL ne peuvent pas être ignorés en CI (test_db_required.py).
      FACTS_TEST_DATABASE_URL: postgresql://facts:facts-ci@localhost:5432/facts_test
      FACTS_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    # Vérifie que l'image de production se construit et démarre, sans secret réel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t facts-api ./backend
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name api -p 8000:8000 \
            -e FACTS_LLM_API_KEY=ci-dummy -e FACTS_SEARCH_PROVIDERS=wikipedia \
            -e FACTS_CORS_ORIGINS=https://facts.pages.dev facts-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Le script de démarrage est exécutable et les migrations sont dans l'image
        run: docker exec api sh -c 'test -x /srv/start.sh && test -f /srv/migrations/versions/0001_app_meta.py'
      - name: Le processus ne tourne pas en root
        run: test "$(docker exec api id -u)" != "0"
