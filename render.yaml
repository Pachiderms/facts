# Blueprint Render (offre gratuite). Les secrets ne sont JAMAIS ici : ils se saisissent dans le tableau de bord.
services:
  - type: web
    name: facts-api-eu
    runtime: docker
    plan: free
    # Région : Francfort (proche des utilisateurs et de la base Neon eu-central-1). Sans cette ligne, Render choisit Oregon.
    # Ne peut pas être modifiée après la création du service : pour changer, créer un nouveau service.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FACTS_ENV
        value: prod
      # Derrière le proxy de Render : l'IP réelle vient de X-Forwarded-For (dernière entrée).
      - key: FACTS_TRUST_PROXY_HEADERS
        value: "true"
      # Adresse EXACTE du front (https://xxx.pages.dev), sans slash final. Sert à CORS et aux WebSockets.
      - key: FACTS_CORS_ORIGINS
        sync: false
      # Adresse PostgreSQL (Neon : variante « pooled »). Optionnelle : vide = salons en mémoire uniquement.
      - key: FACTS_DATABASE_URL
        sync: false
      # Identifiant client Google (PUBLIC, pas un secret) : active « Se connecter avec Google ». Vide = pas de comptes.
      # Les comptes exigent aussi FACTS_DATABASE_URL.
      - key: FACTS_GOOGLE_CLIENT_ID
        sync: false
      - key: FACTS_LLM_API_KEY
        sync: false
      - key: FACTS_TAVILY_API_KEY
        sync: false
      - key: FACTS_LLM_REASONING_EFFORT
        value: low
